# Packages pandoc.wasm staged by scripts/build-wasm.sh in dist/pandoc-wasm.
# pandoc.wasm is a WASI module, the same on every platform, so this is a
# noarch package. Run it with any WASI runtime, e.g.
#
#   wasmtime run "$CONDA_PREFIX/share/pandoc-wasm/pandoc.wasm" --version
#
# It depends on pandoc-api like pandoc does, so that packages meant for
# pandoc.wasm (e.g. filters loaded next to it in a browser) can require a
# matching API.
context:
  version: ${{ env.get("PANDOC_VERSION") }}
  api_version: ${{ env.get("PANDOC_API_VERSION") }}
  build_number: 1

package:
  name: pandoc-wasm
  version: ${{ version }}

source:
  path: ../../dist/pandoc-wasm
  use_gitignore: false

build:
  number: ${{ build_number }}
  noarch: generic
  string: pandoc_forge_${{ build_number }}
  script:
    - mkdir -p "$PREFIX/share/pandoc-wasm"
    - cp pandoc.wasm "$PREFIX/share/pandoc-wasm/pandoc.wasm"

requirements:
  run:
    # see recipes/pandoc-api
    - pandoc-api ${{ api_version }}.*

tests:
  - package_contents:
      files:
        - share/pandoc-wasm/pandoc.wasm

about:
  homepage: https://pandoc.org/app/
  repository: https://github.com/jgm/pandoc
  license: GPL-2.0-or-later
  license_file:
    - COPYING.md
    - COPYRIGHT
  summary: Pandoc compiled to WebAssembly (WASI)
