name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: prefix.dev channel to upload to
        type: choice
        options:
          - pandoc-forge-dev
          - pandoc-forge
        default: pandoc-forge-dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GHC_VERSION: "9.10"
  CABAL_VERSION: "3.14"
  # Same image upstream uses for its static Linux release builds.
  GHC_MUSL_IMAGE: quay.io/benz0li/ghc-musl:9.10
  RATTLER_BUILD_VERSION: v0.76.1

jobs:
  native:
    name: pandoc (${{ matrix.subdir }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - { subdir: linux-64, os: ubuntu-24.04 }
          - { subdir: linux-aarch64, os: ubuntu-24.04-arm }
          - { subdir: osx-64, os: macos-15-intel }
          - { subdir: osx-arm64, os: macos-15 }
          - { subdir: win-64, os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Read pandoc version
        run: echo "PANDOC_VERSION=$(cat PANDOC_VERSION)" >> "$GITHUB_ENV"

      - name: Fetch pandoc source
        run: git clone --depth 1 --branch "$PANDOC_VERSION" https://github.com/jgm/pandoc pandoc-src

      - name: Set up GHC
        if: runner.os != 'Linux'
        id: ghc
        uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Locate cabal store
        id: store
        run: |
          if [[ $RUNNER_OS == Linux ]]; then
            # HOME inside the build container
            echo "path=$HOME/cabal-home" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ steps.ghc.outputs.cabal-store }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore cabal store
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: cabal-${{ matrix.subdir }}-ghc${{ env.GHC_VERSION }}-${{ hashFiles('pandoc-src/cabal.project', 'pandoc-src/**/*.cabal') }}
          restore-keys: cabal-${{ matrix.subdir }}-ghc${{ env.GHC_VERSION }}-

      - name: Build pandoc (static, in Alpine container)
        if: runner.os == 'Linux'
        env:
          CABALOPTS: -f-export-dynamic --enable-executable-static -j4
          GHCOPTS: -j4 +RTS -A256m -RTS -split-sections -optc-Os -optl=-pthread
        run: |
          mkdir -p "$HOME/cabal-home"
          docker run --rm \
            -v "$PWD:/work" -v "$HOME/cabal-home:/cabal-home" -w /work \
            -e HOME=/cabal-home -e CABALOPTS -e GHCOPTS \
            --user "$(id -u):$(id -g)" \
            "$GHC_MUSL_IMAGE" \
            bash -c 'git config --global --add safe.directory "*" && bash scripts/build-native.sh pandoc-src dist/pandoc'

      - name: Build pandoc
        if: runner.os != 'Linux'
        run: bash scripts/build-native.sh pandoc-src dist/pandoc

      - name: Save cabal store
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Package
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          recipe-path: recipes/pandoc/recipe.yaml
          artifact-name: conda-${{ matrix.subdir }}

  wasm:
    name: pandoc-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - name: Read pandoc version
        run: echo "PANDOC_VERSION=$(cat PANDOC_VERSION)" >> "$GITHUB_ENV"

      - name: Fetch pandoc source
        run: git clone --depth 1 --branch "$PANDOC_VERSION" https://github.com/jgm/pandoc pandoc-src

      - name: Restore wasm cabal store
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.ghc-wasm/.cabal
          key: cabal-wasm-${{ hashFiles('pandoc-src/flake.lock', 'pandoc-src/cabal.project', 'pandoc-src/**/*.cabal') }}
          restore-keys: cabal-wasm-

      # Build tools some dependencies need at configure time (pretty-show,
      # toml-parser). Upstream gets them from its nix dev shell.
      - name: Install alex and happy
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends alex happy

      - name: Build pandoc.wasm
        run: bash scripts/build-wasm.sh pandoc-src dist/pandoc-wasm

      - name: Save wasm cabal store
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.ghc-wasm/.cabal
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Package
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          recipe-path: recipes/pandoc-wasm/recipe.yaml
          artifact-name: conda-noarch

  # Pushes to main, and manual runs for the dev channel, upload whatever built.
  upload-dev:
    needs: [native, wasm]
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      inputs.channel != 'pandoc-forge'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # trusted publishing to prefix.dev
    env:
      CHANNEL: ${{ vars.PREFIX_OWNER || 'ickc' }}/pandoc-forge-dev
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: conda-*
          path: packages
          merge-multiple: true

      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          setup-only: true

      # The claims prefix.dev matches against its trusted publisher settings;
      # the token itself is never printed.
      - name: Show OIDC claims
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=prefix.dev" | jq -r .value)
          python3 -c 'import base64, sys; p = sys.argv[1].split(".")[1]; print(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)).decode())' "$token" |
            jq '{sub, repository, repository_owner, workflow_ref, job_workflow_ref, ref, environment, event_name}'

      # Trusted publishing first; if prefix.dev refuses it, fall back to the
      # API key in the PREFIX_API_KEY secret (repo secret for dev, `release`
      # environment secret for release), if there is one.
      - name: Upload to prefix.dev
        env:
          API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          mapfile -d '' pkgs < <(find packages -name '*.conda' -print0)
          printf '%s\n' "${pkgs[@]}"
          upload() { rattler-build upload prefix --channel "$CHANNEL" --skip-existing "${pkgs[@]}"; }
          if upload; then
            echo "::notice::Uploaded to $CHANNEL with trusted publishing"
          elif [[ -n $API_KEY ]]; then
            echo "::warning::Trusted publishing to $CHANNEL failed; retrying with PREFIX_API_KEY"
            PREFIX_API_KEY=$API_KEY upload
          else
            exit 1
          fi

  # The main channel only takes a manual run from main in which every platform
  # built. prefix.dev only trusts this job's token for pandoc-forge because it
  # runs in the `release` environment.
  upload-release:
    needs: [native, wasm]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.channel == 'pandoc-forge' &&
      github.ref == 'refs/heads/main' &&
      needs.native.result == 'success' && needs.wasm.result == 'success'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing to prefix.dev
    env:
      CHANNEL: ${{ vars.PREFIX_OWNER || 'ickc' }}/pandoc-forge
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: conda-*
          path: packages
          merge-multiple: true

      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          setup-only: true

      # The claims prefix.dev matches against its trusted publisher settings;
      # the token itself is never printed.
      - name: Show OIDC claims
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=prefix.dev" | jq -r .value)
          python3 -c 'import base64, sys; p = sys.argv[1].split(".")[1]; print(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)).decode())' "$token" |
            jq '{sub, repository, repository_owner, workflow_ref, job_workflow_ref, ref, environment, event_name}'

      # Trusted publishing first; if prefix.dev refuses it, fall back to the
      # API key in the PREFIX_API_KEY secret (repo secret for dev, `release`
      # environment secret for release), if there is one.
      - name: Upload to prefix.dev
        env:
          API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          mapfile -d '' pkgs < <(find packages -name '*.conda' -print0)
          printf '%s\n' "${pkgs[@]}"
          upload() { rattler-build upload prefix --channel "$CHANNEL" --skip-existing "${pkgs[@]}"; }
          if upload; then
            echo "::notice::Uploaded to $CHANNEL with trusted publishing"
          elif [[ -n $API_KEY ]]; then
            echo "::warning::Trusted publishing to $CHANNEL failed; retrying with PREFIX_API_KEY"
            PREFIX_API_KEY=$API_KEY upload
          else
            exit 1
          fi
