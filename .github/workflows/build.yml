name: Build

on:
  push:
    # main builds the latest pandoc; v* branches (v3.8.x, ...) maintain older ones
    branches: [main, 'v*']
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: prefix.dev channel to upload to
        type: choice
        options:
          - pandoc-forge/dev
          - pandoc-forge
        default: pandoc-forge/dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RATTLER_BUILD_VERSION: v0.76.1

jobs:
  # A release doesn't build: it promotes what is in the dev channel.
  native:
    name: pandoc (${{ matrix.subdir }})
    if: inputs.channel != 'pandoc-forge'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - { subdir: linux-64, os: ubuntu-24.04 }
          - { subdir: linux-aarch64, os: ubuntu-24.04-arm }
          - { subdir: osx-64, os: macos-15-intel }
          - { subdir: osx-arm64, os: macos-15 }
          - { subdir: win-64, os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Read pins
        run: grep -E '^[A-Z_]+=' pins.env >> "$GITHUB_ENV"

      - name: Fetch pandoc source
        run: git clone --depth 1 --branch "$PANDOC_VERSION" https://github.com/jgm/pandoc pandoc-src

      - name: Read pandoc API version
        run: echo "PANDOC_API_VERSION=$(bash scripts/pandoc-api-version.sh pandoc-src)" >> "$GITHUB_ENV"

      - name: Fetch pandoc-crossref source
        run: |
          git clone --depth 1 --branch "$CROSSREF_TAG" https://github.com/lierdakil/pandoc-crossref crossref-src
          # Our patches for this tag, e.g. to admit a newer pandoc than its bounds do
          for p in patches/pandoc-crossref/"$CROSSREF_TAG"/*.patch; do
            [[ -e $p ]] || continue
            echo "Applying $p"
            git -C crossref-src apply --verbose "$PWD/$p"
          done
          echo "CROSSREF_VERSION=$(awk '/^version:/ {print $2}' crossref-src/pandoc-crossref.cabal)" >> "$GITHUB_ENV"

      - name: Set up GHC
        if: runner.os != 'Linux'
        id: ghc
        uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Locate cabal store
        id: store
        run: |
          if [[ $RUNNER_OS == Linux ]]; then
            # HOME inside the build container
            echo "path=$HOME/cabal-home" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ steps.ghc.outputs.cabal-store }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore cabal store
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: cabal-${{ matrix.subdir }}-ghc${{ env.GHC_VERSION }}-${{ env.INDEX_STATE }}-${{ hashFiles('pandoc-src/cabal.project', 'pandoc-src/**/*.cabal', 'crossref-src/*.cabal') }}
          restore-keys: cabal-${{ matrix.subdir }}-ghc${{ env.GHC_VERSION }}-

      # GHC_MUSL_IMAGE is a tag, which benz0li rebuilds from time to time:
      # record which build of it this job used.
      - name: Pull build image
        if: runner.os == 'Linux'
        run: |
          docker pull "$GHC_MUSL_IMAGE"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$GHC_MUSL_IMAGE")
          echo "Build image: $digest"
          echo "Build image (${{ matrix.subdir }}): \`$digest\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Build pandoc (static, in Alpine container)
        if: runner.os == 'Linux'
        env:
          CABALOPTS: -f-export-dynamic --enable-executable-static -j4
          GHCOPTS: -j4 +RTS -A256m -RTS -split-sections -optc-Os -optl=-pthread
        run: |
          mkdir -p "$HOME/cabal-home"
          docker run --rm \
            -v "$PWD:/work" -v "$HOME/cabal-home:/cabal-home" -w /work \
            -e HOME=/cabal-home -e CABALOPTS -e GHCOPTS -e INDEX_STATE \
            --user "$(id -u):$(id -g)" \
            "$GHC_MUSL_IMAGE" \
            bash -c 'git config --global --add safe.directory "*" && bash scripts/build-native.sh pandoc-src dist/pandoc'

      - name: Build pandoc
        if: runner.os != 'Linux'
        run: bash scripts/build-native.sh pandoc-src dist/pandoc

      # pandoc-crossref reuses the pandoc library just built. Its failure
      # doesn't stop pandoc being packaged; upload-release then leaves it out.
      - name: Build pandoc-crossref (static, in Alpine container)
        if: runner.os == 'Linux'
        id: crossref-linux
        continue-on-error: true
        env:
          CABALOPTS: -f-export-dynamic --enable-executable-static -j4
          GHCOPTS: -j4 +RTS -A256m -RTS -split-sections -optc-Os -optl=-pthread
        run: |
          docker run --rm \
            -v "$PWD:/work" -v "$HOME/cabal-home:/cabal-home" -w /work \
            -e HOME=/cabal-home -e CABALOPTS -e GHCOPTS -e PANDOC_VERSION -e CROSSREF_TAG \
            --user "$(id -u):$(id -g)" \
            "$GHC_MUSL_IMAGE" \
            bash -c 'git config --global --add safe.directory "*" && bash scripts/build-crossref.sh pandoc-src crossref-src dist/pandoc-crossref'

      - name: Build pandoc-crossref
        if: runner.os != 'Linux'
        id: crossref
        continue-on-error: true
        run: bash scripts/build-crossref.sh pandoc-src crossref-src dist/pandoc-crossref

      - name: Save cabal store
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # pandoc depends on pandoc-api, so every job builds the (noarch)
      # pandoc-api too, for pandoc's tests to find it. The copies are
      # equivalent; the upload jobs keep one.
      - name: Package
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          recipe-path: recipes/pandoc/recipe.yaml
          build-args: --recipe recipes/pandoc-api/recipe.yaml
          artifact-name: conda-${{ matrix.subdir }}

      # Tests against the pandoc packaged above (rattler-build's output dir is
      # a channel), so this artifact carries a copy of it too.
      - name: Package pandoc-crossref
        id: crossref-package
        if: steps.crossref-linux.outcome == 'success' || steps.crossref.outcome == 'success'
        continue-on-error: true
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          recipe-path: recipes/pandoc-crossref/recipe.yaml
          artifact-name: conda-crossref-${{ matrix.subdir }}

      # The crossref steps above may fail without failing the job, so that
      # pandoc still uploads. On a PR, fail here instead, so that a green PR
      # means crossref built, passed its tests and packaged.
      - name: Check that pandoc-crossref was packaged
        if: github.event_name == 'pull_request' && steps.crossref-package.outcome != 'success'
        run: |
          echo "::error::pandoc-crossref did not build, pass its tests or package; see the crossref steps above"
          exit 1

  wasm:
    name: pandoc-wasm
    if: inputs.channel != 'pandoc-forge'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - name: Read pins
        run: grep -E '^[A-Z_]+=' pins.env >> "$GITHUB_ENV"

      - name: Fetch pandoc source
        run: git clone --depth 1 --branch "$PANDOC_VERSION" https://github.com/jgm/pandoc pandoc-src

      # Upstream builds pandoc.wasm from 3.9 on; older versions have no wasm/.
      - name: Check for wasm support
        id: wasm
        run: |
          if [[ -d pandoc-src/wasm ]]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::pandoc $PANDOC_VERSION has no wasm build upstream; skipping pandoc-wasm"
          fi

      - name: Read pandoc API version
        if: steps.wasm.outputs.supported
        run: echo "PANDOC_API_VERSION=$(bash scripts/pandoc-api-version.sh pandoc-src)" >> "$GITHUB_ENV"

      - name: Restore wasm cabal store
        if: steps.wasm.outputs.supported
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.ghc-wasm/.cabal
          key: cabal-wasm-${{ env.INDEX_STATE }}-${{ hashFiles('pandoc-src/flake.lock', 'pandoc-src/cabal.project', 'pandoc-src/**/*.cabal') }}
          restore-keys: cabal-wasm-

      # Build tools some dependencies need at configure time (pretty-show,
      # toml-parser). Upstream gets them from its nix dev shell.
      - name: Install alex and happy
        if: steps.wasm.outputs.supported
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends alex happy

      - name: Build pandoc.wasm
        if: steps.wasm.outputs.supported
        run: bash scripts/build-wasm.sh pandoc-src dist/pandoc-wasm

      - name: Save wasm cabal store
        if: always() && steps.wasm.outputs.supported && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.ghc-wasm/.cabal
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Package
        if: steps.wasm.outputs.supported
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          recipe-path: recipes/pandoc-wasm/recipe.yaml
          build-args: --recipe recipes/pandoc-api/recipe.yaml
          artifact-name: conda-noarch

  # Pushes to main, and manual runs for the dev channel, upload whatever built,
  # each package with a Sigstore attestation that this workflow built it, on
  # prefix.dev and on GitHub, where a release checks it (promote).
  upload-dev:
    needs: [native, wasm]
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      inputs.channel != 'pandoc-forge'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # trusted publishing to prefix.dev, and the attestations
      attestations: write # --store-github-attestation
    env:
      CHANNEL: ${{ vars.PREFIX_DEV_CHANNEL || 'pandoc-forge/dev' }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: conda-*
          path: packages
          merge-multiple: true

      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          setup-only: true

      # Trusted publishing first; if prefix.dev refuses it, fall back to the
      # API key in the PREFIX_API_KEY secret, if there is one. Attestations
      # need trusted publishing, so a fallback upload has none, and a release
      # won't promote it.
      - name: Upload to prefix.dev
        env:
          API_KEY: ${{ secrets.PREFIX_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' pkgs < <(find packages -name '*.conda' -print0)
          printf '%s\n' "${pkgs[@]}"
          upload() { rattler-build upload prefix --channel "$CHANNEL" --skip-existing "$@" "${pkgs[@]}"; }
          if upload --generate-attestation --store-github-attestation; then
            echo "::notice::Uploaded to $CHANNEL with trusted publishing and attestations"
          elif [[ -n $API_KEY ]]; then
            echo "::warning::Trusted publishing to $CHANNEL failed; retrying with PREFIX_API_KEY, without attestations"
            PREFIX_API_KEY=$API_KEY upload
          else
            exit 1
          fi

  # A release doesn't rebuild. It copies to pandoc-forge the files in the dev
  # channel that this branch's pins.env names (scripts/promote.py), so what
  # was checked there is what is released, byte for byte. Any repository
  # registered for the dev channel can upload to it, so each file must carry
  # an attestation that this repository's build.yml built it. Manual runs
  # from main or a v* branch only. prefix.dev only trusts this job's token
  # for pandoc-forge because it runs in the `release` environment.
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.channel == 'pandoc-forge' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v'))
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing to prefix.dev, and the attestations
    env:
      DEV_CHANNEL: ${{ vars.PREFIX_DEV_CHANNEL || 'pandoc-forge/dev' }}
      CHANNEL: ${{ vars.PREFIX_RELEASE_CHANNEL || 'pandoc-forge' }}
    steps:
      - uses: actions/checkout@v7

      # Every platform's pandoc, pandoc-wasm and pandoc-api, and
      # pandoc-crossref only if it is there for every platform; files
      # already released are left out.
      - name: Fetch from the dev channel
        run: python3 scripts/promote.py --dev "$DEV_CHANNEL" --release "$CHANNEL" packages | tee files.txt

      - name: Check that this repository built them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r f; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
              --predicate-type https://schemas.conda.org/attestations-publish-1.schema.json \
              || { echo "::error::$f has no attestation from this repository's build.yml; rebuild it with a new build number"; exit 1; }
          done < files.txt

      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          setup-only: true

      - name: Upload to prefix.dev
        run: |
          mapfile -t pkgs < files.txt
          if (( ${#pkgs[@]} == 0 )); then
            echo "::notice::Nothing to promote: $CHANNEL has every package"
            exit 0
          fi
          rattler-build upload prefix --channel "$CHANNEL" --skip-existing --generate-attestation "${pkgs[@]}"
