name: Build

on:
  push:
    # main builds the latest pandoc; v* branches (v3.8.x, ...) maintain older ones
    branches: [main, 'v*']
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: prefix.dev channel to upload to
        type: choice
        options:
          - pandoc-forge-dev
          - pandoc-forge
        default: pandoc-forge-dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RATTLER_BUILD_VERSION: v0.76.1

jobs:
  native:
    name: pandoc (${{ matrix.subdir }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - { subdir: linux-64, os: ubuntu-24.04 }
          - { subdir: linux-aarch64, os: ubuntu-24.04-arm }
          - { subdir: osx-64, os: macos-15-intel }
          - { subdir: osx-arm64, os: macos-15 }
          - { subdir: win-64, os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Read pins
        run: grep -E '^[A-Z_]+=' pins.env >> "$GITHUB_ENV"

      - name: Fetch pandoc source
        run: git clone --depth 1 --branch "$PANDOC_VERSION" https://github.com/jgm/pandoc pandoc-src

      - name: Read pandoc API version
        run: echo "PANDOC_API_VERSION=$(bash scripts/pandoc-api-version.sh pandoc-src)" >> "$GITHUB_ENV"

      - name: Fetch pandoc-crossref source
        run: |
          git clone --depth 1 --branch "$CROSSREF_TAG" https://github.com/lierdakil/pandoc-crossref crossref-src
          echo "CROSSREF_VERSION=$(awk '/^version:/ {print $2}' crossref-src/pandoc-crossref.cabal)" >> "$GITHUB_ENV"

      - name: Set up GHC
        if: runner.os != 'Linux'
        id: ghc
        uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Locate cabal store
        id: store
        run: |
          if [[ $RUNNER_OS == Linux ]]; then
            # HOME inside the build container
            echo "path=$HOME/cabal-home" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ steps.ghc.outputs.cabal-store }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore cabal store
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: cabal-${{ matrix.subdir }}-ghc${{ env.GHC_VERSION }}-${{ env.INDEX_STATE }}-${{ hashFiles('pandoc-src/cabal.project', 'pandoc-src/**/*.cabal', 'crossref-src/*.cabal') }}
          restore-keys: cabal-${{ matrix.subdir }}-ghc${{ env.GHC_VERSION }}-

      - name: Build pandoc (static, in Alpine container)
        if: runner.os == 'Linux'
        env:
          CABALOPTS: -f-export-dynamic --enable-executable-static -j4
          GHCOPTS: -j4 +RTS -A256m -RTS -split-sections -optc-Os -optl=-pthread
        run: |
          mkdir -p "$HOME/cabal-home"
          docker run --rm \
            -v "$PWD:/work" -v "$HOME/cabal-home:/cabal-home" -w /work \
            -e HOME=/cabal-home -e CABALOPTS -e GHCOPTS -e INDEX_STATE \
            --user "$(id -u):$(id -g)" \
            "$GHC_MUSL_IMAGE" \
            bash -c 'git config --global --add safe.directory "*" && bash scripts/build-native.sh pandoc-src dist/pandoc'

      - name: Build pandoc
        if: runner.os != 'Linux'
        run: bash scripts/build-native.sh pandoc-src dist/pandoc

      # pandoc-crossref reuses the pandoc library just built. Its failure
      # doesn't stop pandoc being packaged; upload-release then leaves it out.
      - name: Build pandoc-crossref (static, in Alpine container)
        if: runner.os == 'Linux'
        id: crossref-linux
        continue-on-error: true
        env:
          CABALOPTS: -f-export-dynamic --enable-executable-static -j4
          GHCOPTS: -j4 +RTS -A256m -RTS -split-sections -optc-Os -optl=-pthread
        run: |
          docker run --rm \
            -v "$PWD:/work" -v "$HOME/cabal-home:/cabal-home" -w /work \
            -e HOME=/cabal-home -e CABALOPTS -e GHCOPTS \
            --user "$(id -u):$(id -g)" \
            "$GHC_MUSL_IMAGE" \
            bash -c 'git config --global --add safe.directory "*" && bash scripts/build-crossref.sh pandoc-src crossref-src dist/pandoc-crossref'

      - name: Build pandoc-crossref
        if: runner.os != 'Linux'
        id: crossref
        continue-on-error: true
        run: bash scripts/build-crossref.sh pandoc-src crossref-src dist/pandoc-crossref

      - name: Save cabal store
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # pandoc depends on pandoc-api, so every job builds the (noarch)
      # pandoc-api too, for pandoc's tests to find it. The copies are
      # equivalent; the upload jobs keep one.
      - name: Package
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          recipe-path: recipes/pandoc/recipe.yaml
          build-args: --recipe recipes/pandoc-api/recipe.yaml
          artifact-name: conda-${{ matrix.subdir }}

      # Tests against the pandoc packaged above (rattler-build's output dir is
      # a channel), so this artifact carries a copy of it too.
      - name: Package pandoc-crossref
        if: steps.crossref-linux.outcome == 'success' || steps.crossref.outcome == 'success'
        continue-on-error: true
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          recipe-path: recipes/pandoc-crossref/recipe.yaml
          artifact-name: conda-crossref-${{ matrix.subdir }}

  wasm:
    name: pandoc-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - name: Read pins
        run: grep -E '^[A-Z_]+=' pins.env >> "$GITHUB_ENV"

      - name: Fetch pandoc source
        run: git clone --depth 1 --branch "$PANDOC_VERSION" https://github.com/jgm/pandoc pandoc-src

      # Upstream builds pandoc.wasm from 3.9 on; older versions have no wasm/.
      - name: Check for wasm support
        id: wasm
        run: |
          if [[ -d pandoc-src/wasm ]]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::pandoc $PANDOC_VERSION has no wasm build upstream; skipping pandoc-wasm"
          fi

      - name: Read pandoc API version
        if: steps.wasm.outputs.supported
        run: echo "PANDOC_API_VERSION=$(bash scripts/pandoc-api-version.sh pandoc-src)" >> "$GITHUB_ENV"

      - name: Restore wasm cabal store
        if: steps.wasm.outputs.supported
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.ghc-wasm/.cabal
          key: cabal-wasm-${{ env.INDEX_STATE }}-${{ hashFiles('pandoc-src/flake.lock', 'pandoc-src/cabal.project', 'pandoc-src/**/*.cabal') }}
          restore-keys: cabal-wasm-

      # Build tools some dependencies need at configure time (pretty-show,
      # toml-parser). Upstream gets them from its nix dev shell.
      - name: Install alex and happy
        if: steps.wasm.outputs.supported
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends alex happy

      - name: Build pandoc.wasm
        if: steps.wasm.outputs.supported
        run: bash scripts/build-wasm.sh pandoc-src dist/pandoc-wasm

      - name: Save wasm cabal store
        if: always() && steps.wasm.outputs.supported && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.ghc-wasm/.cabal
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Package
        if: steps.wasm.outputs.supported
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          recipe-path: recipes/pandoc-wasm/recipe.yaml
          build-args: --recipe recipes/pandoc-api/recipe.yaml
          artifact-name: conda-noarch

  # Pushes to main, and manual runs for the dev channel, upload whatever built.
  upload-dev:
    needs: [native, wasm]
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      inputs.channel != 'pandoc-forge'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # trusted publishing to prefix.dev
    env:
      CHANNEL: ${{ vars.PREFIX_DEV_CHANNEL || 'ickc/pandoc-forge-dev' }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: conda-*
          path: packages
          merge-multiple: true

      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          setup-only: true

      # Trusted publishing first; if prefix.dev refuses it, fall back to the
      # API key in the PREFIX_API_KEY secret (repo secret for dev, `release`
      # environment secret for release), if there is one.
      - name: Upload to prefix.dev
        env:
          API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          mapfile -d '' pkgs < <(find packages -name '*.conda' -print0)
          printf '%s\n' "${pkgs[@]}"
          upload() { rattler-build upload prefix --channel "$CHANNEL" --skip-existing "${pkgs[@]}"; }
          if upload; then
            echo "::notice::Uploaded to $CHANNEL with trusted publishing"
          elif [[ -n $API_KEY ]]; then
            echo "::warning::Trusted publishing to $CHANNEL failed; retrying with PREFIX_API_KEY"
            PREFIX_API_KEY=$API_KEY upload
          else
            exit 1
          fi

  # The main channel only takes a manual run from main or a v* branch in which
  # every platform built. prefix.dev only trusts this job's token for pandoc-forge because it
  # runs in the `release` environment.
  upload-release:
    needs: [native, wasm]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.channel == 'pandoc-forge' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v')) &&
      needs.native.result == 'success' && needs.wasm.result == 'success'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing to prefix.dev
    env:
      CHANNEL: ${{ vars.PREFIX_RELEASE_CHANNEL || 'ickc/pandoc-forge' }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: conda-*
          path: packages
          merge-multiple: true

      # pandoc-crossref may fail without failing its job. Release it only if it
      # built on every platform, like pandoc.
      - name: Drop pandoc-crossref unless complete
        run: |
          n=$(find packages -name 'pandoc-crossref-*.conda' | wc -l)
          if (( n != 5 )); then
            echo "::warning::pandoc-crossref built on $n of 5 platforms; not releasing it"
            find packages -name 'pandoc-crossref-*.conda' -delete
          fi

      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: ${{ env.RATTLER_BUILD_VERSION }}
          setup-only: true

      # Trusted publishing first; if prefix.dev refuses it, fall back to the
      # API key in the PREFIX_API_KEY secret (repo secret for dev, `release`
      # environment secret for release), if there is one.
      - name: Upload to prefix.dev
        env:
          API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          mapfile -d '' pkgs < <(find packages -name '*.conda' -print0)
          printf '%s\n' "${pkgs[@]}"
          upload() { rattler-build upload prefix --channel "$CHANNEL" --skip-existing "${pkgs[@]}"; }
          if upload; then
            echo "::notice::Uploaded to $CHANNEL with trusted publishing"
          elif [[ -n $API_KEY ]]; then
            echo "::warning::Trusted publishing to $CHANNEL failed; retrying with PREFIX_API_KEY"
            PREFIX_API_KEY=$API_KEY upload
          else
            exit 1
          fi
